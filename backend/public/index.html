<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周易之易 v2 · 八字推盘</title>
  <link href="https://fonts.googleapis.com/css2?family=beVietnamPro:wght@100..900&family=manrope:wght@100..900&family=sourceSerif4:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tailwind.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-surface text-on-surface min-h-screen font-body-md flex flex-col pt-20">

  <!-- 顶栏 -->
  <nav class="fixed top-0 left-0 w-full z-50 bg-surface/90 backdrop-blur-md flex justify-between items-center px-container-padding-mobile md:px-container-padding-desktop h-20 border-b border-outline-variant/10">
    <a class="font-headline-lg text-headline-lg text-primary tracking-tight hover:opacity-80 transition-opacity" href="/">周易之易</a>
    <span class="font-label-sm text-label-sm text-primary bg-surface-container-low rounded-full px-3 py-1">v2 · 离线排盘</span>
  </nav>

  <main class="flex-grow flex flex-col items-center justify-center px-container-padding-mobile md:px-container-padding-desktop py-stack-gap-lg">

    <!-- 标题区 -->
    <div class="text-center mb-stack-gap-lg max-w-2xl">
      <h1 class="font-display-lg text-display-lg text-primary mb-stack-gap-sm">开启您的命理探索</h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant">请输入您的基础出生信息，获取深度命盘解析</p>
    </div>

    <!-- 录入卡片 -->
    <div class="w-full max-w-[600px] glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full pointer-events-none"></div>
      <form id="paipan-form" class="flex flex-col gap-stack-gap-md relative z-10" onsubmit="return false;">

        <!-- 姓名 -->
        <div class="flex flex-col gap-unit">
          <label class="font-title-md text-title-md text-primary flex items-center gap-1" for="name">姓名 <span class="text-error">*</span></label>
          <input id="name" maxlength="10" name="name" type="text" value="李明" placeholder="请输入汉字姓名（最多10字）"
                 class="w-full bg-surface-container-lowest border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-4 py-3 rounded-t text-body-md transition-colors placeholder:text-on-surface-variant/50">
        </div>

        <!-- 性别 -->
        <div class="flex flex-col gap-unit">
          <label class="font-title-md text-title-md text-primary" for="gender">性别 <span class="text-error">*</span></label>
          <select id="gender" name="gender"
                  class="w-full bg-surface-container-lowest border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-4 py-3 rounded-t text-body-md transition-colors appearance-none">
            <option value="男" selected>男</option>
            <option value="女">女</option>
          </select>
        </div>

        <!-- 出生日期与时间 -->
        <div class="flex flex-col gap-unit">
          <label class="font-title-md text-title-md text-primary" for="birthDate">出生日期与时间 <span class="text-error">*</span></label>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-sm">
            <input id="birthDate" name="birthDate" type="date" value="1990-01-15" required
                   class="w-full bg-surface-container-lowest border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-4 py-3 rounded-t text-body-md transition-colors">
            <input id="birthTime" name="birthTime" type="time" value="10:30" required
                   class="w-full bg-surface-container-lowest border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-4 py-3 rounded-t text-body-md transition-colors">
          </div>
          <p class="font-label-sm text-label-sm text-on-surface-variant/70 mt-1 flex items-center gap-1">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>
            </svg>
            若无精准分钟，可选择00分
          </p>
        </div>

        <!-- 出生地 -->
        <div class="flex flex-col gap-unit">
          <label class="font-title-md text-title-md text-primary" for="province">出生地点 <span class="text-error">*</span></label>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap-sm">
            <select id="province" name="province" required
                    class="w-full bg-surface-container-lowest border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-4 py-3 rounded-t text-body-md transition-colors appearance-none"></select>
            <select id="city" name="city" required
                    class="w-full bg-surface-container-lowest border-b border-outline-variant/50 focus:border-primary focus:ring-0 px-4 py-3 rounded-t text-body-md transition-colors appearance-none"></select>
          </div>
        </div>

        <!-- 真太阳时 -->
        <div class="flex items-center justify-between py-3 px-1">
          <div class="flex flex-col">
            <span class="font-title-md text-title-md text-on-surface">真太阳时校正</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant">按经度与均时差换算真太阳时</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="trueSolarTime" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-outline-variant/30 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
          </label>
        </div>

        <!-- 换日方式 -->
        <div class="flex items-center justify-between py-3 px-1">
          <div class="flex flex-col">
            <span class="font-title-md text-title-md text-on-surface">换日方式</span>
            <span id="dayBoundaryHint" class="font-label-sm text-label-sm text-on-surface-variant">00:00 换日（子时归当日）</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="dayBoundary" class="sr-only peer">
            <div class="w-11 h-6 bg-outline-variant/30 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
          </label>
        </div>

        <!-- 动作 -->
        <div class="pt-stack-gap-sm mt-stack-gap-sm border-t border-outline-variant/10 flex flex-col gap-stack-gap-sm">
          <button id="btnChart" type="button"
                  class="w-full bg-primary-container text-on-primary disabled:opacity-60 disabled:cursor-not-allowed py-4 rounded-xl font-title-md text-title-md font-bold shadow-md shadow-primary-container/20 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path>
            </svg>
            排盘（离线计算）
          </button>
          <button id="btnInterpret" type="button"
                  class="w-full bg-transparent border border-primary-container text-primary-container disabled:opacity-60 disabled:cursor-not-allowed py-4 rounded-xl font-title-md text-title-md font-bold flex items-center justify-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            排盘 + 大模型解读
          </button>
        </div>
      </form>
      <p id="msg" class="msg"></p>
    </div>

    <!-- 命盘结果 -->
    <section id="chartSection" class="hidden w-full max-w-6xl">
      <div class="flex flex-col gap-stack-gap-md">

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 21V9"></path>
            </svg>
            四柱
          </h2>
          <div id="pillars" class="grid grid-cols-2 md:grid-cols-4 gap-stack-gap-sm"></div>
        </div>

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4h16v16H4z"></path><path d="M4 10h16M10 4v16"></path>
            </svg>
            派生信息
          </h2>
          <div id="derived"></div>
        </div>

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M8 3v4M16 3v4"></path><path d="M3 9h18"></path><rect x="3" y="5" width="18" height="16" rx="2"></rect>
            </svg>
            干支作用
          </h2>
          <div id="interactions"></div>
        </div>

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m12 3 2.5 5.5L20 10l-4 4 .9 5.5L12 17l-4.9 2.5L8 14l-4-4 5.5-1.5z"></path>
            </svg>
            神煞
          </h2>
          <div id="shensha"></div>
        </div>

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path>
            </svg>
            旺衰与格局
          </h2>
          <div id="analysis"></div>
        </div>

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path>
            </svg>
            大运
          </h2>
          <div id="dayun"></div>
        </div>

        <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
          <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path>
            </svg>
            流年
          </h2>
          <div id="liunian"></div>
        </div>

      </div>
    </section>

    <!-- 解读结果 -->
    <section id="interpretSection" class="hidden w-full max-w-4xl">
      <div class="glass-card rounded-xl p-stack-gap-md md:p-stack-gap-lg">
        <h2 class="font-title-md text-title-md text-primary flex items-center gap-2">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          解读
        </h2>
        <div id="interpretOut" class="flex flex-col gap-unit"></div>
      </div>
    </section>

  </main>

  <script src="./js/app.js"></script>
</body>
</html>
